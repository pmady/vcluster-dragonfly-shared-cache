# Disposable host cluster for the lab: one control-plane and two workers.
# Two workers let tenant-a and tenant-b land on different nodes, which is what
# makes remote-peer transfer observable.
# The node image is pinned to the tested Kubernetes version.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dragonfly-host
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
